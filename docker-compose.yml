services:
  teacher-mi:
    build: .
    image: teacher-mi:latest
    container_name: teacher-mi
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./docker-data/db:/data            # 数据库持久化（更新镜像不丢失）
      - ./docker-data/uploads:/app/backend/uploads   # 附件与 PDF 持久化
    # 优雅停机：给 uvicorn 时间处理完进行中的请求和后台任务
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
