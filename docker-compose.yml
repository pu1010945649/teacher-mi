services:
  teacher-mi:
    image: teacher-mi:latest        # 本机构建后 docker save 导入路由器，路由器上不写 build:
    container_name: teacher-mi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TEACHER_MI_DB=/data/teacher_mi.db   # 数据库落到挂载目录，持久化生效
    volumes:
      - /mnt/sda4/docker/teacher-mi/db:/data            # 数据库持久化（改为路由器实际挂载路径）
      - /mnt/sda4/docker/teacher-mi/uploads:/app/backend/uploads   # 附件与 PDF 持久化
    # 优雅停机：给 uvicorn 时间处理完进行中的请求和后台任务
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
