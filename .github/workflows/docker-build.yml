name: Build Docker Image

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}   # 支持在 GitHub 页面手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # 允许推送到 ghcr.io
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # QEMU：让 x86 构建机可以模拟 arm64
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # buildx：多架构构建必须
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/teacher-mi:latest
            ghcr.io/${{ github.repository_owner }}/teacher-mi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
